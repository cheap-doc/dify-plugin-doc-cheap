identity:
  name: recognize_document
  author: doc-cheap
  label:
    en_US: Recognize Document
description:
  human:
    en_US: Read a passport, national ID card or driver's licence from an image and return its fields as JSON. Costs $0.01 per recognised document; an image with no readable document costs nothing.
  llm: Reads an identity document (passport, national ID card or driver's licence) from an image file or an image URL and returns the holder's printed fields, the document data and the machine-readable zone status as JSON. Use it when a user shares a photo or scan of an identity document and wants it read or checked.
parameters:
  - name: image
    type: file
    required: false
    label:
      en_US: Image File
    human_description:
      en_US: A photo or scan of the document (JPEG, PNG, WebP and other common image types). Give either this or Image URL.
    llm_description: The image file of the identity document. Provide either image or image_url.
    form: llm
  - name: image_url
    type: string
    required: false
    label:
      en_US: Image URL
    human_description:
      en_US: A public http or https address of the document image, used when no file is given.
    llm_description: A public http or https URL of the identity document image. Used only when no image file is given.
    form: llm
  - name: expect_country
    type: string
    required: false
    label:
      en_US: Expected Country
    human_description:
      en_US: Optional three-letter country code (ISO 3166-1 alpha-3) of the issuing country, such as GRC, to help recognition.
    llm_description: Optional ISO 3166-1 alpha-3 code of the issuing country, for example GRC. Leave empty when unknown.
    form: llm
  - name: reference
    type: string
    required: false
    label:
      en_US: Reference
    human_description:
      en_US: Optional label of your own (up to 128 characters), such as an order number, stored with the scan.
    llm_description: Optional caller label up to 128 characters, returned with the scan.
    form: form
  - name: return_portrait
    type: boolean
    required: false
    default: true
    label:
      en_US: Return Portrait
    human_description:
      en_US: Include the cropped portrait image in the full answer.
    form: form
  - name: retain_hours
    type: number
    required: false
    min: 0
    max: 8760
    label:
      en_US: Keep Result (Hours)
    human_description:
      en_US: How many hours the result stays readable with Get Scan (0–8760). Leave empty to use the account setting; 0 keeps nothing to read back.
    form: form
  - name: idempotency_key
    type: string
    required: false
    label:
      en_US: Idempotency Key
    human_description:
      en_US: Optional unique value; a retry with the same key returns the first result instead of running again.
    form: form
  - name: simplify
    type: boolean
    required: false
    default: true
    label:
      en_US: Simplify
    human_description:
      en_US: Return a flat summary (holder, document, status). Turn off to get the full answer with every field, crop and check.
    form: form
extra:
  python:
    source: tools/recognize_document.py
